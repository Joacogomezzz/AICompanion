workflows:
  ios-mvp-build:
    name: iOS MVP Build
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Set Xcode version
        script: |
          sudo xcode-select -p
          xcodebuild -version

      - name: Build for simulator (compile check)
        script: |
          xcodebuild \
            -project AICompanion.xcodeproj \
            -scheme AICompanion \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - AICompanion.xcodeproj/

    publishing:
      email:
        recipients:
          - lautic003@gmail.com
        notify:
          success: true
          failure: true
