name: AICompanion
options:
  bundleIdPrefix: com.lautaro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.lautaro.aicompanion
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

targets:
  AICompanion:
    type: application
    platform: iOS
    sources:
      - path: AICompanion
        createIntermediateGroups: true
    settings:
      base:
        INFOPLIST_FILE: AICompanion/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lautaro.aicompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
